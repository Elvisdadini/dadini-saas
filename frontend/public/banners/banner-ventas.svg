<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061c33"/><stop offset="1" stop-color="#0d3b66"/>
    </linearGradient>
    <linearGradient id="naranja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6500"/><stop offset="1" stop-color="#ff9b45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#fondo)"/>
  <circle cx="1050" cy="90" r="230" fill="#ffffff" opacity="0.05"/>
  <circle cx="980" cy="590" r="180" fill="#ff6500" opacity="0.07"/>
  <rect x="760" y="110" width="370" height="410" rx="18" fill="#ffffff" opacity="0.08"/>
  <rect x="790" y="150" width="150" height="12" rx="6" fill="#7fd1ff" opacity="0.8"/>
  <rect x="790" y="180" width="250" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
  <g fill="url(#naranja)">
